[project]
name = "drafting-assistant"
version = "1.0.0"
description = "Insafdaar AI legal document drafting service (FastAPI + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "asyncpg>=0.30.0",
    "google-genai>=1.0.0",
    "python-docx>=1.1.0",
    "httpx>=0.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]